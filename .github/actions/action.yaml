name: wolfictl-lint
runs:
  using: composite

  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        repository: wolfi-dev/wolfictl
        path: wolfictl-setup-gha

    - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: 'wolfictl-setup-gha/go.mod'
        check-latest: true

    - id: build
      shell: bash
      run: |
        (
          cd wolfictl-setup-gha || exit
          make wolfictl
          mv wolfictl /home/runner/go/bin/
        )
        rm -rf wolfictl-setup-gha
